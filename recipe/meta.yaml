{% set name = "xorg-libXmu" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ name.split('-')[1] }}-{{ version }}.tar.xz
  sha256: 81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11, libice aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
    - autoconf
    - automake
    - gettext
    - libtool
  host:
    - pthread-stubs ==0.3
    - xorg-xorgproto {{ xorg_xorgproto }}
    - xorg-libx11 {{ xorg_libx11 }}
    - xorg-libxext {{ xorg_libxext }}
    - xorg-libxt {{ xorg_libxt }}
    - xorg-util-macros ==1.20.2

test:
  commands:
    - test -f $PREFIX/lib/libXmu.dylib  # [osx]
    - test -f $PREFIX/lib/libXmu.so  # [linux]
    - test -f $PREFIX/lib/libXmuu.dylib  # [osx]
    - test -f $PREFIX/lib/libXmuu.so  # [linux]

about:
  home: https://www.x.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxmu
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxmu
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: The X.org X11 miscellaneous utility library.
  description: The X.org X11 miscellaneous utility library.

extra:
  recipe-maintainers:
    - pkgw
    - ehfd
